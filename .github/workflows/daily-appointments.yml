name: Daily Appointment Data Scraping

# ---------------------------------------------------------------------------
# Yocale retired the Kibana site this workflow used to scrape (last good run
# 2026-09-13). It now serves the same data as a CSV behind HTTP Basic Auth,
# refreshed on Yocale's side every 30 minutes, so the job is a single HTTP
# request: no browser, no Playwright, no login walk.
#
# The feed is the FULL booking history including future-dated bookings, not a
# rolling window, so KIBANA_TIME_FROM/TIME_TO have no equivalent and are gone.
#
# TWO ENTITIES, TWO JOBS (deliberate duplication — see note)
#
# PCJL and Najjar are separate franchise entities, each writing to its own
# Supabase project. The jobs are duplicated rather than matrixed on purpose:
# GitHub's `secrets` context is NOT available in a `strategy.matrix` block, so
# a matrix would require renaming PCJL's live secrets to a prefixed scheme.
# Duplication keeps a mistake on the Najjar job from taking PCJL down.
# >>> If you change the feed step in one job, change it in the other. <<<
#
# Najjar is NOT live yet: Yocale has only issued a PCJL feed
# (/reports/pcjl/appointments-daily.csv). Its job runs on dispatch only, and
# needs NAJJAR_YOCALE_CSV_URL / _USER / _PASSWORD set once Yocale provides
# them. Najjar's own Kibana feed is dead in the meantime.
# ---------------------------------------------------------------------------

on:
  schedule:
    # Hourly, but deliberately NOT at :00. Yocale rebuilds the file every 30
    # minutes, and a request that arrives mid-rebuild can hang for ~45s and
    # then be dropped (RemoteDisconnected) — which is how the 06:27 and 13:35
    # runs on 2026-09-29 failed while a cached response answered in 1.1s.
    # Asking at :20 aims between their rebuilds; csv_feed.py also retries.
    - cron: '20 * * * *'
  workflow_dispatch:
    inputs:
      entity:
        description: 'Which entity to run'
        type: choice
        options:
          - pcjl
          - najjar
          - both
        default: pcjl
      dry_run:
        description: 'Dry run — fetch and summarize, write NOTHING to the database'
        type: boolean
        default: false

jobs:
  # =========================================================================
  # PCJL — live. Runs on the schedule and on dispatch.
  # =========================================================================
  feed-pcjl:
    name: Load PCJL feed
    if: ${{ github.event_name == 'schedule' || github.event.inputs.entity == 'pcjl' || github.event.inputs.entity == 'both' }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Load appointments (PCJL)
      env:
        YOCALE_CSV_URL: ${{ secrets.YOCALE_CSV_URL }}
        YOCALE_CSV_USER: ${{ secrets.YOCALE_CSV_USER }}
        YOCALE_CSV_PASSWORD: ${{ secrets.YOCALE_CSV_PASSWORD }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # github.event.inputs is null on scheduled runs => '0' => never a dry run.
        DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
      run: python csv_feed.py

    - name: Summary
      if: always()
      run: |
        echo "## PCJL Feed Summary" >> $GITHUB_STEP_SUMMARY
        echo "- **Date:** $(date)" >> $GITHUB_STEP_SUMMARY
        echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Dry run:** ${{ github.event.inputs.dry_run || 'false' }}" >> $GITHUB_STEP_SUMMARY

  # =========================================================================
  # NAJJAR — dispatch only until Yocale issues a Najjar feed URL and login.
  # Writes to NAJJAR-GREETS (bsubveplzmippvkogqhf).
  # =========================================================================
  feed-najjar:
    name: Load Najjar feed
    if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.entity == 'najjar' || github.event.inputs.entity == 'both') }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Load appointments (Najjar)
      env:
        YOCALE_CSV_URL: ${{ secrets.NAJJAR_YOCALE_CSV_URL }}
        YOCALE_CSV_USER: ${{ secrets.NAJJAR_YOCALE_CSV_USER }}
        YOCALE_CSV_PASSWORD: ${{ secrets.NAJJAR_YOCALE_CSV_PASSWORD }}
        SUPABASE_URL: ${{ secrets.NAJJAR_SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NAJJAR_SUPABASE_SERVICE_ROLE_KEY }}
        DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
      run: python csv_feed.py

    - name: Summary
      if: always()
      run: |
        echo "## Najjar Feed Summary" >> $GITHUB_STEP_SUMMARY
        echo "- **Date:** $(date)" >> $GITHUB_STEP_SUMMARY
        echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Dry run:** ${{ github.event.inputs.dry_run || 'false' }}" >> $GITHUB_STEP_SUMMARY
